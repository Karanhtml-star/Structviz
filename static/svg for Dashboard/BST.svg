<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- tree connections -->
  <line x1="60" y1="25" x2="30" y2="50" stroke="#E6E8F0" stroke-width="3"/>
  <line x1="60" y1="25" x2="90" y2="50" stroke="#E6E8F0" stroke-width="3"/>
  <line x1="30" y1="50" x2="20" y2="80" stroke="#E6E8F0" stroke-width="3"/>
  <line x1="30" y1="50" x2="40" y2="80" stroke="#E6E8F0" stroke-width="3"/>
  <line x1="90" y1="50" x2="80" y2="80" stroke="#E6E8F0" stroke-width="3"/>
  <line x1="90" y1="50" x2="100" y2="80" stroke="#E6E8F0" stroke-width="3"/>

  <!-- tree nodes -->
  <circle cx="60" cy="25" r="8" fill="#E6E8F0"/>
  <circle cx="30" cy="50" r="7" fill="#E6E8F0"/>
  <circle cx="90" cy="50" r="7" fill="#E6E8F0"/>
  <circle cx="20" cy="80" r="6" fill="#E6E8F0"/>
  <circle cx="40" cy="80" r="6" fill="#E6E8F0"/>
  <circle cx="80" cy="80" r="6" fill="#E6E8F0"/>
  <circle cx="100" cy="80" r="6" fill="#E6E8F0"/>

  <!-- magnifying glass -->
  <circle
    cx="60"
    cy="60"
    r="18"
    stroke="#E6E8F0"
    stroke-width="4"
    fill="rgba(230,232,240,0.1)"
  />
  <line
    x1="73"
    y1="73"
    x2="90"
    y2="90"
    stroke="#E6E8F0"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- center text -->
  <text
    x="60"
    y="66"
    text-anchor="middle"
    font-size="14"
    fill="#E6E8F0"
    font-family="Instrument Sans, sans-serif"
    font-weight="700"
  >
    mid
  </text>
</svg>
